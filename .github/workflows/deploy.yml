name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t chatbot-backend:${{ github.sha }} ./backend
      - name: Build frontend image
        run: docker build -t chatbot-frontend:${{ github.sha }} ./frontend
