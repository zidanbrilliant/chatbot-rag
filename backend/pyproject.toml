[project]
name = "knowledge-base-chatbot"
version = "1.0.0"
description = "Internal Knowledge Base Chatbot RAG — FastAPI backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.6",
    "python-multipart==0.0.19",
    "uvicorn==0.34.0",
    "sqlalchemy==2.0.36",
    "psycopg2-binary==2.9.10",
    "qdrant-client==1.12.1",
    "groq>=0.9.0",
    "langchain-text-splitters==0.3.4",
    "pdfplumber==0.11.4",
    "python-docx==1.1.2",
    "pandas==2.2.3",
    "openpyxl==3.1.5",
    "requests==2.32.3",
    "pydantic==2.10.3",
    "pydantic-settings>=2.6.0",
    "alembic>=1.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "black>=24.0.0",
    "mypy>=1.13.0",
    "pre-commit>=3.8.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["alembic/versions/*", "__pycache__"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "N818", # error suffix on exception names (too strict)
    "B008", # function call in arg defaults (FastAPI Depends pattern)
    "SIM108", # prefer ternary (cosmetic)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.black]
target-version = ["py310"]
line-length = 100
exclude = "alembic/versions"

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = false
ignore_missing_imports = true
exclude = ["alembic/", "tests/"]
check_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
